<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#aa8214"/>
      <stop offset="100%" stop-color="#fdf0cd"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with subtle border -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#cyanGrad)" stroke-width="0.8" stroke-dasharray="3, 3" opacity="0.6"/>

  <!-- Wordsmith Monogram Crest -->
  <g filter="url(#glow)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Quill / Sword Axis -->
    <path d="M64 18 L68 40 L64 106 L60 40 Z" fill="url(#goldGrad)" fill-opacity="0.2" stroke-width="1.8"/>
    <line x1="64" y1="20" x2="64" y2="104" stroke-width="1.5" stroke="#fff1c5"/>
    
    <!-- Quill Nib Slit -->
    <circle cx="64" cy="80" r="2" fill="url(#cyanGrad)" stroke="none"/>
    <line x1="64" y1="82" x2="64" y2="104" stroke-width="1.8" stroke="url(#cyanGrad)"/>

    <!-- Geometric Symmetrical Wings / Crossguard -->
    <path d="M42 46 C50 42, 58 46, 64 52 C70 46, 78 42, 86 46" stroke-width="2.2"/>
    <path d="M34 56 C44 48, 54 52, 64 64 C74 52, 84 48, 94 56" stroke-width="1.8"/>
    
    <!-- Chevron Caliper / Compass / Diamond -->
    <path d="M40 76 L64 52 L88 76" stroke-width="2"/>
    <polygon points="64,32 74,44 64,56 54,44" fill="none" stroke-width="1.5"/>

    <!-- Anvil / Base balance bars -->
    <line x1="48" y1="88" x2="80" y2="88" stroke-width="2"/>
    <circle cx="48" cy="88" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="80" cy="88" r="2.5" fill="url(#goldGrad)"/>

    <!-- Outer Nodes -->
    <circle cx="64" cy="20" r="2.5" fill="#fff1c5"/>
    <circle cx="34" cy="56" r="2" fill="url(#cyanGrad)"/>
    <circle cx="94" cy="56" r="2" fill="url(#cyanGrad)"/>
  </g>
</svg>
